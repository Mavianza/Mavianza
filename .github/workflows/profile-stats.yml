name: Perbarui statistik profil

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'
  push:
    paths:
      - '.github/workflows/profile-stats.yml'
      - 'scripts/profile_stats.py'

concurrency:
  group: profile-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Hitung statistik dan render SVG
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/profile_stats.py --login "$PROFILE_OWNER"
      - name: Simpan kedua panel
        run: |
          git add -- assets/streak.svg assets/bahasa.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update profile statistics'
          git push origin "HEAD:$GITHUB_REF"
